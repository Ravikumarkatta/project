groups:
  - name: bible-ai-alerts
    rules:
      - alert: HighCPUUsage
        expr: cpu_usage > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is {{ $value }}%"

      - alert: HighMemoryUsage
        expr: memory_usage > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value }}%"

      - alert: APIHighLatency
        expr: rate(api_request_duration_seconds[5m]) > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "API latency is high"
          description: "API endpoint {{ $labels.endpoint }} is responding slowly"

      - alert: BibleDataNotLoaded
        expr: bible_data_loaded == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Bible data not loaded"
          description: "The application is running without Bible data loaded"
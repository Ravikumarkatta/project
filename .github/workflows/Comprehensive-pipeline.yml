name: Bible-AI Pipeline

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 1'  # Weekly run at 2 AM on Mondays

jobs:
  code-quality:
    name: Code Quality & Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Static Type Checking
        run: |
          mypy src/ --ignore-missing-imports --disallow-untyped-defs
      
      - name: Linting & Code Style
        run: |
          black --check src/ tests/
          flake8 src/ tests/ --max-line-length=100 --extend-ignore=E203
          isort --check-only --profile black src/ tests/
          
      - name: Security Scan
        run: |
          bandit -r src/
          safety check -r requirements.txt

  testing:
    name: Testing Matrix
    needs: code-quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Verify biblical data integrity
        run: |
          python scripts/verify_biblical_data.py
      
      - name: Run unit tests with pytest
        run: |
          pytest tests/unit/ -v --cov=src/ --cov-report=xml
      
      - name: Run theological validation tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          python scripts/theology_validator.py --test-mode
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          flags: unittests,os-${{ matrix.os }},python-${{ matrix.python-version }}

  integration-testing:
    name: Integration Testing
    needs: testing
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Run API integration tests
        run: |
          python app.py &
          sleep 5  # Wait for server to start
          pytest tests/integration/ -v
      
      - name: Test theological system integration
        run: |
          python -m src.theology.validator --integration-test

  build:
    name: Build Package
    needs: [integration-testing]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      
      - name: Build package
        run: python -m build
      
      - name: Check build artifacts
        run: |
          ls -l dist/
          twine check dist/*

  deploy:
    name: Deploy
    needs: [build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/bible-ai:latest
            ghcr.io/${{ github.repository }}/bible-ai:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

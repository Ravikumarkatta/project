name: Bible-AI CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 1'  # Weekly deep scan

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  code-quality:
    name: Code Quality & Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      
      - name: Static Type Checking
        run: mypy src/ --config-file mypy.ini
      
      - name: Linting & Code Style
        run: |
          black --check src/ tests/
          ruff check src/ tests/
          isort --check-only --profile black src/ tests/
          flake8 src/ tests/ --max-line-length=100 --extend-ignore=E203
          
      - name: Security Scan
        run: |
          bandit -r src/
          safety check -r requirements.txt -r requirements-dev.txt
      
      - name: Code Complexity Analysis
        run: |
          radon cc src/ -a -nc
          radon mi src/ -s

  testing:
    name: Testing Matrix
    needs: code-quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12']
        include:
          - os: ubuntu-latest
            python-version: '3.12'
            run-coverage: true
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      
      - name: Verify data integrity
        run: python scripts/verify_biblical_data.py
      
      - name: Run tests with coverage
        if: matrix.run-coverage
        run: |
          pytest tests/ -v --cov=src/ --cov-report=xml --cov-report=term
      
      - name: Run tests without coverage
        if: "!matrix.run-coverage"
        run: pytest tests/ -v
      
      - name: Run health checks
        run: |
          python scripts/health_check.py --output health_report.json
          if [ -f health_report.json ]; then
            echo "Health Check Results:"
            cat health_report.json
          fi
      
      - name: Upload coverage to Codecov
        if: matrix.run-coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linters
        run: |
          npm run lint
          npm run stylelint
      
      - name: Run tests
        run: npm test -- --coverage
      
      - name: Build frontend
        run: npm run build
      
      - name: Verify frontend build
        run: ../scripts/verify-frontend.sh
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: build

  performance:
    name: Performance Testing
    needs: [testing, frontend]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      
      - name: Start services for benchmarking
        run: |
          docker-compose up -d
          sleep 10  # Wait for services to be ready
      
      - name: Run benchmarks
        run: |
          python scripts/benchmark.py --quick --output benchmarks/output.json
          
      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'python'
          output-file-path: benchmarks/output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: true
      
      - name: Run final health check
        run: python scripts/health_check.py --output final_health.json

  package:
    name: Build Package
    needs: [testing]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      
      - name: Build package
        run: python -m build
      
      - name: Verify package
        run: |
          ls -l dist/
          twine check dist/*
      
      - name: Upload package artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dist
          path: dist/

  deploy:
    name: Deploy
    needs: [package, frontend, performance]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download frontend build
        uses: actions/download-artifact@v3
        with:
          name: frontend-build
          path: frontend/build
      
      - name: Download package
        if: github.ref == 'refs/heads/main'
        uses: actions/download-artifact@v3
        with:
          name: dist
          path: dist
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            ENVIRONMENT=${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Deploy to environment
        run: |
          echo "Deploying to ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}"
          ./scripts/deploy.sh ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      
      - name: Verify deployment
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ./scripts/verify-deployment.sh https://your-bible-ai.com
          else
            ./scripts/verify-deployment.sh https://staging.your-bible-ai.com
          fi
      
      - name: Run post-deployment health check
        run: |
          python scripts/health_check.py \
            --url ${{ github.ref == 'refs/heads/main' && 'https://your-bible-ai.com' || 'https://staging.your-bible-ai.com' }} \
            --output deployment_health.json

  docs:
    name: Documentation
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      
      - name: Build documentation
        run: |
          python scripts/generate_api_docs.py
          mkdocs build
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site

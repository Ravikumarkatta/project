name: Bible-AI Basic Pipeline

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  code-quality:
    name: Basic Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install pytest black flake8
          fi
      
      - name: Code Style Check
        continue-on-error: true  # Don't fail the build for code style issues initially
        run: |
          if command -v black &> /dev/null; then
            black --check src/ tests/ || echo "Black style issues found"
          else
            echo "Black not installed, skipping"
          fi
          
          if command -v flake8 &> /dev/null; then
            flake8 src/ tests/ --max-line-length=100 --extend-ignore=E203 || echo "Flake8 issues found"
          else
            echo "Flake8 not installed, skipping"
          fi

  testing:
    name: Basic Testing
    needs: code-quality
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install pytest
          fi
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
      
      - name: Verify directory structure
        run: |
          # Check for essential directories
          mkdir -p src tests scripts config
          touch src/__init__.py tests/__init__.py
          echo "Directory structure verified or created"
      
      - name: Create test file if needed
        run: |
          # Create a simple test if none exist
          if [ ! "$(find tests -name 'test_*.py' 2>/dev/null)" ]; then
            echo "Creating basic test file"
            echo 'def test_basic():' > tests/test_basic.py
            echo '    """Basic test to ensure testing infrastructure works."""' >> tests/test_basic.py
            echo '    assert True' >> tests/test_basic.py
          fi
      
      - name: Run tests
        run: |
          # Run tests with appropriate test runner
          if command -v pytest &> /dev/null; then
            pytest tests/ -v
          else
            python -m unittest discover tests
          fi

  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    if: false  # Disable this job initially until frontend is set up
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Check if frontend exists
        id: check_frontend
        run: |
          if [ -d "frontend" ] && [ -f "frontend/package.json" ]; then
            echo "Frontend directory exists with package.json"
            echo "HAS_FRONTEND=true" >> $GITHUB_ENV
          else
            echo "Frontend directory or package.json missing"
            echo "HAS_FRONTEND=false" >> $GITHUB_ENV
          fi
      
      - name: Set up Node.js
        if: env.HAS_FRONTEND == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        if: env.HAS_FRONTEND == 'true'
        run: |
          cd frontend
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi
      
      - name: Run basic frontend checks
        if: env.HAS_FRONTEND == 'true'
        run: |
          cd frontend
          if npm test -- --passWithNoTests; then
            echo "Frontend tests passed"
          else
            echo "Frontend tests failed but continuing"
          fi

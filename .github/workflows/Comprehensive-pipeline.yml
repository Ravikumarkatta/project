name: Bible-AI Comprehensive Pipeline

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install pytest black flake8
          fi

      - name: Code Style Check
        continue-on-error: true
        run: |
          if command -v black &> /dev/null; then
            black --check src/ tests/ || echo "Black style issues found"
          else
            echo "Black not installed, skipping"
          fi
          
          if command -v flake8 &> /dev/null; then
            flake8 src/ tests/ --max-line-length=100 --extend-ignore=E203 || echo "Flake8 issues found"
          else
            echo "Flake8 not installed, skipping"
          fi

  testing:
    name: Comprehensive Testing
    needs: code-quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install pytest pytest-cov
          fi
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Verify directory structure
        run: |
          mkdir -p src tests scripts config
          touch src/__init__.py tests/__init__.py
          echo "Directory structure verified"

      - name: Run all tests with pytest
        run: |
          echo "Running all tests with pytest..."
          python -m pytest tests/ -v

      - name: Run tests with coverage (if pytest-cov installed)
        continue-on-error: true
        run: |
          if pip list | grep -q pytest-cov; then
            echo "Running tests with coverage..."
            python -m pytest tests/ --cov=src/ --cov-report=xml
          else
            echo "pytest-cov not installed, skipping coverage report"
          fi

  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    if: false  # Disable this job initially until frontend is set up

    steps:
      - uses: actions/checkout@v4

      - name: Check if frontend exists
        id: check_frontend
        run: |
          if [ -d "frontend" ] && [ -f "frontend/package.json" ]; then
            echo "Frontend directory exists with package.json"
            echo "HAS_FRONTEND=true" >> $GITHUB_ENV
          else
            echo "Frontend directory or package.json missing"
            echo "HAS_FRONTEND=false" >> $GITHUB_ENV
          fi

      - name: Set up Node.js
        if: env.HAS_FRONTEND == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: env.HAS_FRONTEND == 'true'
        run: |
          cd frontend
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Run basic frontend checks
        if: env.HAS_FRONTEND == 'true'
        run: |
          cd frontend
          if npm test -- --passWithNoTests; then
            echo "Frontend tests passed"
          else
            echo "Frontend tests failed but continuing"
          fi

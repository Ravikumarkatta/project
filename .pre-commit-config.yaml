repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-json
    -   id: check-added-large-files
    -   id: debug-statements
    -   id: detect-private-key

# Ruff replaces black, isort, and flake8
-   repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version. Must be kept in sync with installed ruff version in requirements.txt
    rev: v0.11.7
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format

-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0 # Consider updating mypy rev and installed version later
    hooks:
    -   id: mypy
